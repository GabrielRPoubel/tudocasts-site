<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUDOCASTS :: EPISÓDIO</title>
  <script>
    var caminho = location.pathname;
    var raiz = caminho.indexOf('/tudocasts-site') === 0 ? '/tudocasts-site/' : '/';
    document.write('<base href="' + raiz + '">');
  </script>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="styles.css?v=20261121d">
</head>
<body>

<div id="idioma-box">
  <button id="btn-idioma" type="button" title="Language / Idioma" aria-label="Language">
    <svg width="16" height="16" viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="2" y="0" width="3" height="1" fill="#e6e6e6"></rect>
      <rect x="1" y="1" width="5" height="1" fill="#e6e6e6"></rect>
      <rect x="0" y="2" width="7" height="3" fill="#e6e6e6"></rect>
      <rect x="1" y="5" width="5" height="1" fill="#e6e6e6"></rect>
      <rect x="2" y="6" width="3" height="1" fill="#e6e6e6"></rect>
      <rect x="3" y="0" width="1" height="7" fill="#000"></rect>
      <rect x="0" y="3" width="7" height="1" fill="#000"></rect>
    </svg>
  </button>
  <div id="menu-idioma" hidden>
    <button type="button" data-lang="pt">PT</button>
    <button type="button" data-lang="es">ES</button>
    <button type="button" data-lang="en">EN</button>
  </div>
</div>

<center><h1 class="logo" style="font-size:28px">TUDOCASTS</h1></center>
<div id="status-ep" class="status">CARREGANDO EPISÓDIO...</div>

<div class="episodio" id="pagina" hidden>
  <img id="capa" class="capa" alt="capa do episódio" hidden>
  <div id="sem-capa" class="sem-capa" hidden>SEM IMAGEM</div>
  <h2 id="titulo"></h2>
  <div class="autor" id="autor"></div>

  <div class="controles-ep">
    <button id="play" class="btn-play">></button>
    <span id="atual">0:00</span>
    <input id="progresso" type="range" min="0" max="1000" value="0">
    <span id="total">0:00</span>
  </div>

  <div class="velocidades" id="velocidades">
    <button data-v="0.75">0.75x</button>
    <button data-v="1">1x</button>
    <button data-v="1.25">1.25x</button>
    <button data-v="1.5">1.5x</button>
    <button data-v="2">2x</button>
    <button data-v="4">4x</button>
  </div>

  <div class="descricao" id="descricao"></div>

  <div class="navegacao">
    <span id="anterior"></span>
    <span id="proximo"></span>
  </div>

  <div id="acoes"></div>

  <div class="comentarios">
    <b id="comentarios-titulo" data-i18n="COMENTARIOS">:: COMENTÁRIOS ::</b>
    <div id="comentarios"></div>
    <div id="form-comentario" hidden>
      <input id="texto-comentario" type="text" maxlength="500" placeholder="SEU COMENTÁRIO">
      <button id="btn-comentar" type="button">COMENTAR</button>
    </div>
  </div>

  <p style="text-align:center"><a id="voltar" href="#" data-i18n="VOLTAR_FEED">[VOLTAR AO FEED]</a></p>
</div>

<input id="troca-imagem-ep" type="file" accept="image/*" hidden>
<footer class="aviso-legal" data-i18n="AVISO_LEGAL">© 2026 TUDOCASTS. Todos os direitos reservados. Todo o conteúdo publicado é de inteira responsabilidade de quem o postou e não representa a opinião da plataforma.</footer>

<audio id="player" preload="metadata"></audio>
<script src="i18n.js?v=20261122d"></script>
<script src="episode.js?v=20261122d"></script>
</body>
</html>
